<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="TicTacToe.css"/>
  <script src="ticTacToe.js" defer></script>
</head>
<body>
  <main class="card">
    <h1 class="title">Tic Tac <span>Toe</span></h1>
    <p class="status" id="status" aria-live="polite">Giliranmu!</p>

    <div class="board" id="board" role="grid" aria-label="Papan tic tac toe"></div>

    <div class="difficulty" role="group" aria-label="Tingkat kesulitan">
      <button class="chip" id="easy" type="button">Mudah</button>
      <button class="chip active" id="hard" type="button">Sulit</button>
    </div>

    <div class="scoreboard">
      <div class="score">
        <span class="score-label">Kamu</span>
        <strong id="score-win">0</strong>
      </div>
      <div class="score">
        <span class="score-label">Seri</span>
        <strong id="score-draw">0</strong>
      </div>
      <div class="score">
        <span class="score-label">Bot</span>
        <strong id="score-lose">0</strong>
      </div>
    </div>

    <button class="reset" id="reset" type="button">Main Lagi</button>
  </main>

  
</body>
</html>
